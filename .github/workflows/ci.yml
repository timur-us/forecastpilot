name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Re-run a deployment by hand, e.g. after a failed run (the change
  # detection below only looks at the latest push).
  workflow_dispatch:
    inputs:
      deploy_api:
        description: Deploy the API to Azure
        type: boolean
        default: false
      deploy_web:
        description: Publish web/ to GitHub Pages
        type: boolean
        default: false

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  docker-build:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t forecastpilot:ci .

  # Which parts of main changed in this push. Lint and tests always run;
  # only the deploy jobs are gated on it.
  changes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.diff.outputs.api }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          FORCE_API: ${{ inputs.deploy_api }}
          FORCE_WEB: ${{ inputs.deploy_web }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "manual run: api=$FORCE_API web=$FORCE_WEB"
            echo "api=$FORCE_API" >> "$GITHUB_OUTPUT"; echo "web=$FORCE_WEB" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable base commit; deploying everything"
            echo "api=true" >> "$GITHUB_OUTPUT"; echo "web=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --no-renames --name-only "$BASE" "$HEAD")
          printf 'changed files:\n%s\n' "$files"
          api=false; web=false
          # What goes into the image or the rollout: app code, runtime pins,
          # the Dockerfile and its ignore list, and this workflow (env values).
          echo "$files" | grep -qE '^(app/|requirements\.txt$|Dockerfile$|\.dockerignore$|\.github/workflows/ci\.yml$)' && api=true
          echo "$files" | grep -qE '^web/' && web=true
          echo "api=$api" >> "$GITHUB_OUTPUT"; echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "api=$api web=$web"

  # ---------------------------------------------------------------
  # W4 — Deploy the API to Azure Container Apps
  # ---------------------------------------------------------------
  deploy:
    needs: [lint-test, docker-build, changes]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    # Model and pricing used in production, versioned here and applied on
    # every deploy. The API key stays an Azure secret (anthropic-api-key)
    # referenced by the existing ANTHROPIC_API_KEY variable of the app.
    env:
      ANTHROPIC_MODEL: claude-sonnet-5-5
      ANTHROPIC_PRICE_INPUT_PER_MTOK: "2.0"
      ANTHROPIC_PRICE_OUTPUT_PER_MTOK: "10.0"
      # Container Apps ingress network; its X-Forwarded-For identifies the caller.
      TRUSTED_PROXY_CIDRS: 100.64.0.0/10
      # Browser origin of the web UI on GitHub Pages (origin only, no path).
      CORS_ORIGINS: https://timur-us.github.io
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ca06d26caabdacr.azurecr.io/forecastpilot:${{ github.sha }} .
      - name: Log in to ACR
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login ca06d26caabdacr.azurecr.io -u ${{ secrets.ACR_USERNAME }} --password-stdin
      - name: Push image
        run: docker push ca06d26caabdacr.azurecr.io/forecastpilot:${{ github.sha }}
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy to Container App
        run: |
          az containerapp update \
            -n forecastpilot -g forecastpilot-rg \
            --image ca06d26caabdacr.azurecr.io/forecastpilot:${{ github.sha }} \
            --set-env-vars \
              "ANTHROPIC_MODEL=${{ env.ANTHROPIC_MODEL }}" \
              "ANTHROPIC_PRICE_INPUT_PER_MTOK=${{ env.ANTHROPIC_PRICE_INPUT_PER_MTOK }}" \
              "ANTHROPIC_PRICE_OUTPUT_PER_MTOK=${{ env.ANTHROPIC_PRICE_OUTPUT_PER_MTOK }}" \
              "TRUSTED_PROXY_CIDRS=${{ env.TRUSTED_PROXY_CIDRS }}" \
              "CORS_ORIGINS=${{ env.CORS_ORIGINS }}"

  # ---------------------------------------------------------------
  # Web UI — static page on GitHub Pages (served from web/)
  # ---------------------------------------------------------------
  pages:
    needs: [lint-test, changes]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
