name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Re-run a deployment by hand, e.g. after a failed run (the change
  # detection below only looks at the latest push).
  workflow_dispatch:
    inputs:
      deploy_api:
        description: Deploy the API to Azure
        type: boolean
        default: false
      deploy_web:
        description: Publish web/ to GitHub Pages
        type: boolean
        default: false

# Read-only token by default; a job that needs more says so itself (pages).
permissions:
  contents: read

# Every action is pinned to a full commit SHA; the comment names the release.
# Dependabot (.github/dependabot.yml) proposes updates weekly.
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      # No Azure login needed: downloads the pinned Bicep CLI, then compiles
      # and lints the template and the parameter file (the single source).
      # Pull requests get no what-if here; see README, "Infrastructure".
      - name: Bicep build and lint
        env:
          # Placeholders so main.bicepparam compiles; not secrets, and the
          # compiled output goes to /dev/null.
          IMAGE_TAG: ci
          ANTHROPIC_API_KEY: ci-placeholder
        run: |
          az bicep install --version v0.48.1
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep
          az bicep build-params --file infra/main.bicepparam --stdout > /dev/null
          az bicep lint --file infra/main.bicepparam

  # Known vulnerabilities in the runtime pins (OSV database). Fails only when
  # a fixed version exists; see .github/scripts/pip-audit-gate.sh.
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          # Not requirements*.txt: that is lint-test's cache key, and this
          # job (which only installs pip-audit) could save it first.
          cache-dependency-path: requirements.txt
      - run: pip install pip-audit==2.10.1
      - run: bash .github/scripts/pip-audit-gate.sh

  docker-build:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t forecastpilot:ci .
      # The image starts and answers /health within 30 seconds (it runs
      # without setuptools, which the Dockerfile removes). The key is a
      # placeholder: /health needs none, and no LLM call is made.
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 127.0.0.1:8000:8000 \
            -e ANTHROPIC_API_KEY=smoke-placeholder forecastpilot:ci > /dev/null
          deadline=$((SECONDS + 30))
          status=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:8000/health || true)
            [ "$status" = "200" ] && break
            [ "$(docker inspect -f '{{.State.Running}}' smoke)" = "true" ] || break
            sleep 1
          done
          if [ "$status" = "200" ]; then
            echo "/health answered 200"
            docker stop smoke > /dev/null
            exit 0
          fi
          echo "::error::/health did not answer 200 within 30 seconds, or the container exited (last status: ${status:-none})"
          docker logs smoke
          docker stop smoke > /dev/null || true
          exit 1
      # Trivy comes from its release tarball, checked against a committed
      # checksum, not from aquasecurity/trivy-action or setup-trivy: both had
      # their tags replaced with a credential stealer in March 2026
      # (GHSA-69fq-xp46-6x23). Update both values together.
      - name: Install Trivy
        env:
          # Not TRIVY_VERSION: Trivy reads TRIVY_<flag> variables as flags.
          TRIVY_RELEASE: "0.76.1"
          # sha256 of trivy_0.76.1_Linux-64bit.tar.gz as listed in the
          # release's trivy_0.76.1_checksums.txt; matched a local download,
          # `gh release verify-asset` and `gh attestation verify` (2026-10-25).
          TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          tarball="trivy_${TRIVY_RELEASE}_Linux-64bit.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_RELEASE}/$tarball"
          echo "$TRIVY_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/trivy"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/trivy" trivy
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"
      # The vulnerability DB, one cache entry per UTC day. Every run restores
      # the newest entry; only main saves, since an entry saved on a pull
      # request is visible to that pull request only.
      - id: utc-date
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - id: trivy-db
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy/db
          key: trivy-db-${{ steps.utc-date.outputs.day }}
          restore-keys: trivy-db-
      # Fails on CRITICAL or HIGH findings that have a fix. Accepted findings
      # go into .trivyignore.yaml with a reason and an expiry date.
      - name: Scan image
        run: >-
          trivy image --scanners vuln --severity CRITICAL,HIGH
          --ignore-unfixed --exit-code 1 --ignorefile .trivyignore.yaml
          --format table forecastpilot:ci
      - if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.trivy-db.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy/db
          key: trivy-db-${{ steps.utc-date.outputs.day }}

  # Which parts of main changed in this push. Lint and tests always run;
  # only the deploy jobs are gated on it.
  changes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.diff.outputs.api }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          FORCE_API: ${{ inputs.deploy_api }}
          FORCE_WEB: ${{ inputs.deploy_web }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "manual run: api=$FORCE_API web=$FORCE_WEB"
            echo "api=$FORCE_API" >> "$GITHUB_OUTPUT"; echo "web=$FORCE_WEB" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable base commit; deploying everything"
            echo "api=true" >> "$GITHUB_OUTPUT"; echo "web=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --no-renames --name-only "$BASE" "$HEAD")
          printf 'changed files:\n%s\n' "$files"
          api=false; web=false
          # What goes into the image or the rollout: app code, runtime pins,
          # the Dockerfile and its ignore list, and the infrastructure
          # template with its parameters (model, pricing, scale). This
          # workflow carries no deployed values, so editing it deploys
          # nothing; a changed deploy job goes out with workflow_dispatch.
          echo "$files" | grep -qE '^(app/|infra/|requirements\.txt$|Dockerfile$|\.dockerignore$)' && api=true
          echo "$files" | grep -qE '^web/' && web=true
          echo "api=$api" >> "$GITHUB_OUTPUT"; echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "api=$api web=$web"

  # ---------------------------------------------------------------
  # W4 — Deploy the API to Azure Container Apps
  # ---------------------------------------------------------------
  deploy:
    # pip-audit too: a known vulnerability with a fix stops the deploy, like
    # a red Trivy scan does through docker-build.
    needs: [lint-test, pip-audit, docker-build, changes]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    # One deployment at a time: overlapping runs would write the same nested
    # deployment. A waiting run is not cancelled halfway through an ARM call.
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    # Rolls out infra/main.bicep with scope=app: only the Container App is
    # written; registry, logs and environment are referenced as existing.
    # Model, pricing, proxy trust, CORS and the replica limit come from
    # infra/main.bicepparam (the single source). This job supplies only the
    # image tag, the API key and DEPLOY_SCOPE=app (set explicitly, so a push
    # never widens the scope), as environment variables that main.bicepparam
    # reads, so the key never appears on a command line.
    env:
      IMAGE: ca06d26caabdacr.azurecr.io/forecastpilot:${{ github.sha }}
      IMAGE_TAG: ${{ github.sha }}
      DEPLOY_SCOPE: app
    steps:
      - name: Require the API key secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::GitHub secret ANTHROPIC_API_KEY is empty or missing; nothing was deployed."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Log in to ACR
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login ca06d26caabdacr.azurecr.io -u ${{ secrets.ACR_USERNAME }} --password-stdin
      # The tag is the commit SHA and is never overwritten: a re-run or a
      # workflow_dispatch (for example a key rotation) deploys the image that
      # was already pushed for this commit. If the check itself fails, the
      # image is built and pushed as before.
      - name: Build and push image
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "$IMAGE already exists in the registry; not rebuilt."
          else
            docker build -t "$IMAGE" .
            docker push "$IMAGE"
          fi
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Install Bicep
        run: az bicep install --version v0.48.1
      # Printed for the record, not a gate: create runs whatever this
      # reports. Pull requests have no Azure login; a PR that changes infra/
      # carries a what-if run by hand in its description.
      - name: what-if
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: az deployment group what-if -g forecastpilot-rg -f infra/main.bicep -p infra/main.bicepparam
      - name: Deploy the Container App
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          az deployment group create -g forecastpilot-rg -n "forecastpilot-$IMAGE_TAG" \
            -f infra/main.bicep -p infra/main.bicepparam \
            --query properties.provisioningState -o tsv
          az containerapp show -n forecastpilot -g forecastpilot-rg \
            --query "{revision:properties.latestRevisionName,image:properties.template.containers[0].image,secrets:properties.configuration.secrets[].name}" -o json

  # ---------------------------------------------------------------
  # Web UI — static page on GitHub Pages (served from web/)
  # ---------------------------------------------------------------
  pages:
    needs: [lint-test, changes]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
