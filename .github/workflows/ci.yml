name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q

  docker-build:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t forecastpilot:ci .

  # ---------------------------------------------------------------
  # W4 — Deploy to Azure Container Apps
  # ---------------------------------------------------------------
  deploy:
    needs: [lint-test, docker-build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ca06d26caabdacr.azurecr.io/forecastpilot:${{ github.sha }} .
      - name: Log in to ACR
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login ca06d26caabdacr.azurecr.io -u ${{ secrets.ACR_USERNAME }} --password-stdin
      - name: Push image
        run: docker push ca06d26caabdacr.azurecr.io/forecastpilot:${{ github.sha }}
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy to Container App
        run: |
          az containerapp update \
            -n forecastpilot -g forecastpilot-rg \
            --image ca06d26caabdacr.azurecr.io/forecastpilot:${{ github.sha }}
